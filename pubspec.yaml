name: encuesta_emprendimiento_ctc
description: Sistema de Encuestas Emprendimiento CTC

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.5
  firebase_auth: ^4.20.0
  provider: ^6.1.1
  intl: ^0.19.0
  csv: ^5.1.1
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  path: ^1.8.3
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "imagen/ctc-logo.png"
  adaptive_icon_foreground: "imagen/ctc-logo.png"
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - imagen/ctc-logo1.png